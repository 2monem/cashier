<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1628" />
  <link rel="manifest" href="manifest.json" />
  <title>محل أسواق الموسكي</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
    :root {
      --bg:#050d1a;--surface:#0a1628;--surface2:#0f2040;--border:#1a3a6e;
      --accent:#1d6fe8;--accent2:#60a5fa;--green:#22c55e;--red:#ef4444;
      --yellow:#f59e0b;--text:#e0eaff;--muted:#6b8cbc;--radius:14px;
      --shadow:0 4px 24px rgba(0,0,0,0.5);
      --accent-glow:0 0 20px rgba(29,111,232,0.3);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:30px;}

    /* HEADER */
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px;}
    .logo{font-size:1.1rem;font-weight:900;color:var(--accent2);}
    .logo span{color:var(--text);}
    nav{display:flex;gap:4px;flex-wrap:wrap;}
    nav button{background:none;border:none;color:var(--muted);font-family:'Cairo',sans-serif;font-size:0.85rem;padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap;}
    nav button:hover{background:var(--surface2);color:var(--text);}
    nav button.active{background:var(--accent);color:#fff;box-shadow:var(--accent-glow);}
    
    .container {max-width: 1100px; margin: 20px auto; padding: 0 16px;}

    /* PROFIT SECTION STYLES */
    .profit-section {background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-top: 20px;}
    .section-title {font-size: 1.2rem; font-weight: 700; color: var(--accent2); margin-bottom: 16px;}
    .profit-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;}
    .card {background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; text-align: center;}
    .card span {font-size: 0.9rem; color: var(--muted); display: block; margin-bottom: 8px;}
    .card h3 {font-size: 1.5rem; font-weight: 900;}
    
    .card.makeup h3 {color: var(--accent2);}
    .card.acc h3 {color: var(--yellow);}
    .card.total {border-color: var(--green); background: rgba(34, 197, 94, 0.05);}
    .card.total h3 {color: var(--green);}
  </style>
</head>
<body>

  <header>
    <div class="logo">محل <span>أسواق الموسكي</span></div>
    <nav>
      <button class="active">تقرير الأرباح</button>
    </nav>
  </header>

  <main class="container">
    <section class="profit-section">
      <div class="section-title">📊 تفاصيل أرباح المحل</div>
      
      <div class="profit-grid">
        <div class="card makeup">
          <span>💄 ربح المكياج</span>
          <h3 id="makeup-profit">0 ج.م</h3>
        </div>

        <div class="card acc">
          <span>💍 ربح الاكسسوارات</span>
          <h3 id="acc-profit">0 ج.م</h3>
        </div>

        <div class="card total">
          <span>💰 إجمالي ربح المحل</span>
          <h3 id="total-profit">0 ج.م</h3>
        </div>
      </div>
    </section>
  </main>

  <script>
    // جلب المبيعات المخزنة من localStorage (أو مصفوفة فارغة إذا لم توجد)
    const salesData = JSON.parse(localStorage.getItem('sales_history') || '[]');

    function calculateProfits() {
      let makeupProfit = 0;
      let accProfit = 0;

      salesData.forEach(item => {
        // حماية البيانات: حساب التكلفة الافتراضية 0 إن لم توجد تجنباً للأخطاء
        const sellPrice = item.price || 0;
        const costPrice = item.cost || 0;
        const qty = item.qty || 1;
        const profit = (sellPrice - costPrice) * qty;

        // التصنيف بناءً على نوع المنتج
        if (item.category === 'مكياج') {
          makeupProfit += profit;
        } else if (item.category === 'اكسسوارات' || item.category === 'إكسسوارات') {
          accProfit += profit;
        } else {
          // أي قسم آخر يضاف مباشرة للإجمالي
          makeupProfit += 0; 
        }
      });

      const totalProfit = makeupProfit + accProfit;

      // تحديث الواجهة بالعرض العربي للعملة
      document.getElementById('makeup-profit').textContent = makeupProfit.toLocaleString('ar-EG') + ' ج.م';
      document.getElementById('acc-profit').textContent = accProfit.toLocaleString('ar-EG') + ' ج.م';
      document.getElementById('total-profit').textContent = totalProfit.toLocaleString('ar-EG') + ' ج.م';
    }

    // تشغيل الحساب فور تحميل الصفحة
    document.addEventListener('DOMContentLoaded', calculateProfits);
  </script>
</body>
</html>
